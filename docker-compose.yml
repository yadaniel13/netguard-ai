version: "3.9"

services:
  netguard:
    build: .
    container_name: netguard_ai
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./static/charts:/app/static/charts
      - ./database:/app/database
      - ./datasets:/app/datasets
    environment:
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
